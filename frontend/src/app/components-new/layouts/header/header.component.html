<header class="top-bar"> 
  <div class="logo">
    <h1>Plaza</h1>
  </div>

  <div class="auth-buttons">
    @if (!authService.isLoggedIn) {
      <button class="login-btn" routerLink="/login">Se connecter</button>
      <button class="register-btn" routerLink="/register">S'inscrire</button>
    } @else {
      <span class="welcome">Bonjour {{ authService.currentUser?.firstname }}</span>

      <!-- ADMIN : uniquement le bouton dashboard -->
      @if (authService.hasRole('admin')) {
        <button class="my-shop-btn" routerLink="/dashboard">Dashboard</button>
      }

      <!-- MANAGER : bouton ma boutique -->
      @if (authService.hasRole('manager')) {
        <button class="my-shop-btn" routerLink="/dashboard-shop">Ma boutique</button>
      }

      <!-- USER uniquement : commandes, panier, favoris -->
      @if (!authService.hasRole('admin') && !authService.hasRole('manager')) {
        <button routerLink="/orders">Mes commandes</button>
        <button routerLink="/cart">Mon panier</button>
        <button class="favorites-btn" routerLink="/favorites">Mes favoris</button>
      }

      <button class="logout-btn" (click)="authService.logout()">Déconnexion</button>
    }
  </div>
</header>
