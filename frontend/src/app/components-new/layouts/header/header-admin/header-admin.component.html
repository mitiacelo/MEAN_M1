<div class="admin-layout">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <span class="brand-name">
        {{ centreName || 'Mall' }}<span class="brand-accent">.</span>
      </span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>
      <a routerLink="/grille" routerLinkActive="active" class="nav-item">Centre commercial</a>
      <a routerLink="/notifications" routerLinkActive="active" class="nav-item nav-item--notif">
        Demandes location <span *ngIf="pendingCount > 0">{{ pendingCount }}</span>
      </a>
      <a routerLink="/location" routerLinkActive="active" class="nav-item">Location</a>
      <a routerLink="/maintenance" routerLinkActive="active" class="nav-item nav-item--maint">
        Maintenance <span *ngIf="urgentsCount > 0">{{ urgentsCount }}</span>
      </a>
      <div class="nav-separator"></div>
      <a routerLink="/parametres" routerLinkActive="active" class="nav-item">Paramètres</a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">Déconnexion</button>
    </div>

  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
